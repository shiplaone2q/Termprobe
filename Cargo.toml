[workspace]
members = [
    "crates/termprobe",
    "crates/termprobe-cli",
    "crates/termprobe-ffi",
    "tools/bindgen",
]
default-members = [
    "crates/termprobe",
    "crates/termprobe-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/microsoft/termprobe"

[workspace.dependencies]
alacritty_terminal = "0.26.0"
rio-vt = "0.5.3"
anyhow = "1.0.102"
base64 = "0.22.1"
bitflags = "2.13.1"
clap = { version = "4.6.1", features = ["derive"] }
compact_str = "0.10.0"
crossterm = "0.28"
dialoguer = { version = "0.11", default-features = false }
dirs = "6.0.0"
flate2 = "1.1.9"
fontdb = { version = "0.23.0", default-features = false, features = ["fs", "std"] }
gif = "0.14.0"
interprocess = "2.4.2"
rquickjs = { version = "0.12.2", features = ["parallel"] }
