[build-system]
requires = ["setuptools>=68", "setuptools-rust>=1.9,<2", "wheel>=0.41"]
build-backend = "setuptools.build_meta"

[project]
name = "termprobe"
version = "0.1.1"
description = "Python bindings for termprobe terminal automation"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Microsoft" }]
keywords = ["terminal", "pty", "automation", "testing", "tui", "termprobe"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/microsoft/termprobe"
Repository = "https://github.com/microsoft/termprobe"

[tool.setuptools.packages.find]
where = ["src"]
