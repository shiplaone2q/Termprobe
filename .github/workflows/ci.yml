name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        include:
          - os: macos-latest
            bin: target/debug/termprobe
          - os: windows-latest
            bin: target/debug/termprobe.exe
          - os: ubuntu-latest
            bin: target/debug/termprobe
    runs-on: ${{ matrix.os }}
    env:
      TERMPROBE__BIN: ${{ github.workspace }}/${{ matrix.bin }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: |
          rustup toolchain install stable --profile default
          rustup default stable
          rustup component add clippy rustfmt

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.16.0"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bindings/js/package-lock.json

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: bindings/go/go.mod
          cache-dependency-path: bindings/go/go.sum

      - name: Install maintenance script dependencies
        run: npm ci --prefix .github/scripts --ignore-scripts

      - run: cargo fmt --all -- --check
      - name: Verify generated native declarations
        run: cargo run --locked -p termprobe-bindgen -- --check
