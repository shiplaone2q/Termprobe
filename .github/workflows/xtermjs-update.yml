name: Update xterm.js

# A vendored bundle has nothing watching it: no lockfile, no dependency bot,
# and no build that fails when it falls behind. This checks weekly and opens a
# pull request when either package has a newer release.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Check npm for newer releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Re-vendor at the latest releases
        id: vendor
        shell: bash
        run: |
          set -euo pipefail
